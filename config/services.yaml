parameters:
    views_dir: '%kernel.project_dir%/resources/views'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Every class under src/ becomes a service keyed by its FQCN, except the
    # directories below which hold plain data objects or are wired explicitly.
    App\:
        resource: '../src/*'
        exclude:
            - '../src/Entities/'
            - '../src/System/'

    # Controllers are exposed as public services so the container-aware
    # controller resolver can fetch them by "FQCN::method" strings.
    App\Http\:
        resource: '../src/Http'
        tags: ['controller.service_arguments']
        public: true

    Twig\Loader\FilesystemLoader:
        arguments: ['%views_dir%']

    Twig\Environment:
        arguments:
            - '@Twig\Loader\FilesystemLoader'
            - { strict_variables: true }

    App\System\View\IView:
        class: App\System\View\View
        public: true

    App\System\Config\IConfig:
        class: App\System\Config\Config
        arguments:
            $projectDir: '%kernel.project_dir%'
            $files: ['app.yaml', 'database.yaml']
        public: true

    App\System\Database\Orm:
        arguments:
            $projectDir: '%kernel.project_dir%'
        public: true
